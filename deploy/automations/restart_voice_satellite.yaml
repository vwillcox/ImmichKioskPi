# Works around OHF-Voice/linux-voice-assistant issue #355: the satellite
# silently stops hearing its wake word after playing a response, and the only
# known recovery is a restart. This is that issue's own documented workaround
# — restart shortly after each completed interaction, before the deafness has
# a chance to set in.
#
# Append to Home Assistant's automations.yaml, or paste into an automation's
# YAML editor. Needs rest_command.restart_voice_satellite from
# deploy/homeassistant.yaml.
- id: "restart_voice_satellite_after_interaction"
  alias: "Restart voice satellite after each interaction"
  description: >
    linux-voice-assistant has a known unresolved bug where it stops hearing
    the wake word after a response plays. Restarting a few seconds after
    every completed interaction is the workaround the bug report itself
    documents.
  trigger:
    - trigger: state
      entity_id: assist_satellite.kiosk
      to: "idle"
  action:
    - delay:
        seconds: 12
    - action: rest_command.restart_voice_satellite
  mode: single
