<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiosk dashboard</title>
<style>
  :root {
    --bg: #0e1016; --panel: #171a22; --line: #262b36;
    --text: #eef1f6; --muted: #9aa3b2; --accent: #7dd3fc; --danger: #f87171;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; flex: 1; }
  button, select {
    font: inherit; color: var(--text); background: #212734;
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 14px;
    cursor: pointer; min-height: 40px;
  }
  button.primary { background: var(--accent); color: #06232e; border-color: transparent; font-weight: 600; }
  button.danger { color: var(--danger); }
  #pageBar { display: inline-flex; align-items: center; gap: 6px; }
  #pageBar button { min-width: 36px; }
  #pageLabel { color: var(--muted); font-size: 13px; min-width: 84px;
               text-align: center; }
  #pageSeconds { width: 64px; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: 13px; min-width: 8ch; }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    background: #212734; border: 1px solid var(--line); border-radius: 9px;
    padding: 0 14px; min-height: 40px; font-size: 14px; white-space: nowrap;
  }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

  main { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; padding: 18px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0,1fr); } }

  /* The canvas mirrors the kiosk's 1920x1200 panel. */
  #canvasWrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
  /* The canvas is a real preview: the selected theme's own background,
     tiles and colours, at the panel's proportions. */
  #canvas {
    position: relative; width: 100%; aspect-ratio: 1920 / 1200;
    background: var(--t-bg, #0b0d13);
    border-radius: 8px; overflow: hidden; touch-action: none;
    container-type: size;
  }
  #gridlines {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to right, rgba(128,128,128,.16) 1px, transparent 1px) 0 0 / calc(100%/12) 100%,
      linear-gradient(to bottom, rgba(128,128,128,.16) 1px, transparent 1px) 0 0 / 100% calc(100%/8);
  }
  .tile {
    position: absolute;
    background: var(--t-surface, #1d2331);
    border: 1px solid var(--t-border, #313a4d);
    border-radius: var(--t-radius, 10px);
    box-shadow: var(--t-shadow, none);
    padding: 8px; overflow: hidden; cursor: grab;
    display: flex; flex-direction: column; gap: 2px; user-select: none;
  }
  .tile.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The tile under the finger goes above the others. Without this it is drawn
     in configuration order, so dragging one over an earlier tile hides it
     behind the thing it is being moved past — which is exactly when you need
     to see it. The lift and shadow say which one is being moved. */
  .tile.dragging {
    z-index: 5;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .55);
    cursor: grabbing;
  }
  /* Selected sits above the rest too, just below whatever is being dragged,
     so the tile you are editing is not obscured while you set it up. */
  .tile.selected { z-index: 3; }
  .tile.clash { outline: 2px solid var(--danger); outline-offset: 2px; }
  .tile .glyph { font-size: 18px; line-height: 1; }
  .tile .name {
    font-size: 12px; color: var(--t-muted, var(--muted));
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Stand-in content, so a tile shows what it will look like rather than
     what it is called. */
  .tile .body {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    justify-content: center; gap: .18em; overflow: hidden;
  }
  .tile .line {
    line-height: 1.1; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: var(--t-text);
    /* Never squashed. As flex children these shrank to fit the body instead
       of overflowing it, which made lines overlap and — worse — made
       scrollHeight equal clientHeight, so nothing could detect that the
       content did not fit. */
    flex: 0 0 auto;
  }
  .tile .line.muted { color: var(--t-muted); }
  .tile .line.accent { color: var(--t-accent); }
  .tile .badge {
    position: absolute; top: 4px; left: 6px; font-size: 11px; opacity: .55;
    pointer-events: none;
  }
  .tile .handle {
    position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 50%, var(--t-accent, var(--accent)) 50%);
    opacity: .8; border-bottom-right-radius: 9px;
  }

  aside {
    display: flex; flex-direction: column; gap: 14px;
    /* Sticky and scrollable, so the settings for the widget being edited
       stay reachable however long the canvas is. */
    position: sticky; top: 18px; max-height: calc(100vh - 36px);
    overflow-y: auto;
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .palette button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; text-align: center; }
  .palette .g { font-size: 20px; }
  .palette .n { font-size: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; background: #0f1219; border: 1px solid var(--line);
    border-radius: 9px; padding: 10px; color: var(--text); font: inherit;
  }
  textarea { min-height: 76px; resize: vertical; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  /* Collapsible panels. The header stays put and the body is what folds, so
     a collapsed panel is still a labelled target you can find and reopen. */
  .panelHead {
    cursor: pointer; user-select: none; display: flex; align-items: center;
    gap: 8px; margin: 0;
  }
  .panelHead .chev {
    display: inline-block; transition: transform .15s ease;
    font-size: 12px; color: var(--muted);
  }
  .card.collapsed .panelHead { margin: 0; }
  .card.collapsed .panelHead .chev { transform: rotate(-90deg); }
  .card.collapsed .panelBody { display: none; }
  .panelBody { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .field { font-size: 12px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row #pageLabel { flex: 1; }
  .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .empty { color: var(--muted); font-size: 14px; }
  .warn { color: var(--danger); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Kiosk dashboard</h1>
  <span id="status">Loading…</span>
  <button id="revert">Revert</button>
  <button id="save" class="primary">Save</button>
</header>

<main>
  <div id="canvasWrap">
    <div id="canvas"><div id="gridlines"></div></div>
    <div id="clashWarning" class="warn" hidden>Two widgets overlap — drag one clear.</div>
  </div>

  <aside>
    <!-- Every panel collapses to its own header. On a laptop the sidebar is
         taller than the window once all three are open, and the settings for
         the widget you are actually editing are the ones at the bottom. -->
    <section class="card" data-panel="dashboard">
      <h2 class="panelHead"><span class="chev">▾</span>Dashboard</h2>
      <div class="panelBody">
        <label class="field">Theme</label>
        <select id="theme" title="Theme"></select>

        <div class="row">
          <label class="toggle"><input type="checkbox" id="roundedCorners"> Rounded corners</label>
          <label class="toggle"><input type="checkbox" id="tileShadows"> Shadows</label>
        </div>

        <label class="field">Pages</label>
        <div class="row" id="pageBar">
          <button id="pagePrev" title="Previous page">‹</button>
          <span id="pageLabel">Page 1 / 1</span>
          <button id="pageNext" title="Next page">›</button>
        </div>
        <div class="row">
          <button id="pageAdd" title="Add a page">+ Page</button>
          <button id="pageDel" title="Delete this page" class="danger">− Page</button>
        </div>

        <div class="row">
          <label class="toggle" title="0 leaves paging manual">
            Flip every <input type="number" id="pageSeconds" min="0" max="3600" step="1"> s
          </label>
        </div>
        <div class="row">
          <label class="toggle"><input type="checkbox" id="tapToFlip"> Tap to flip</label>
        </div>
      </div>
    </section>

    <section class="card" data-panel="palette">
      <h2 class="panelHead"><span class="chev">▾</span>Add a widget</h2>
      <div class="panelBody">
        <div class="palette" id="palette"></div>
      </div>
    </section>

    <section class="card" data-panel="settings" id="settingsCard">
      <h2 class="panelHead"><span class="chev">▾</span>Widget settings</h2>
      <div class="panelBody">
        <div id="settings"><p class="empty">Select a widget to change its settings.</p></div>
      </div>
    </section>
  </aside>
</main>

<script>
"use strict";

const state = {
  schema: null,
  dashboard: null,
  selectedId: null,
  dirty: false,
  // Which page is being edited, and how many the user has opened up. The
  // latter is separate because an empty new page has no widgets to infer it
  // from and would otherwise disappear the moment it was added.
  page: 0,
  pagesShown: 1,
  // What each widget is showing on the panel right now, keyed by widget id.
  live: {},
};

const canvas = document.getElementById("canvas");
const statusEl = document.getElementById("status");

const api = {
  async get(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(path + " -> " + r.status);
    return r.json();
  },
  async put(path, body) {
    const r = await fetch(path, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(path + " -> " + r.status);
    return r.json();
  },
};

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.style.color = isError ? "var(--danger)" : "var(--muted)";
}

function markDirty() {
  state.dirty = true;
  setStatus("Unsaved changes");
}

function typeOf(name) {
  return state.schema.widgetTypes.find(t => t.type === name);
}

/* ---------- rendering ---------- */

function overlaps(a, b) {
  return a.x < b.x + b.width && b.x < a.x + a.width &&
         a.y < b.y + b.height && b.y < a.y + a.height;
}

/* Flutter writes colours as #aarrggbb; CSS reads 8-digit hex as #rrggbbaa.
   Converting rather than reordering at the source keeps the saved theme
   files in the one format the app itself uses. */
function cssColour(v) {
  if (typeof v !== "string") return "transparent";
  const hex = v.replace("#", "");
  if (hex.length === 6) return "#" + hex;
  if (hex.length !== 8) return v;
  const a = parseInt(hex.slice(0, 2), 16) / 255;
  const r = parseInt(hex.slice(2, 4), 16);
  const g = parseInt(hex.slice(4, 6), 16);
  const b = parseInt(hex.slice(6, 8), 16);
  return "rgba(" + r + "," + g + "," + b + "," + a.toFixed(3) + ")";
}

function currentTheme() {
  return state.schema.themes.find(t => t.id === state.dashboard.themeId)
      || state.schema.themes[0];
}

function applyTheme() {
  const t = currentTheme();
  if (!t) return;
  const bg = (t.background || []).map(cssColour);
  const s = canvas.style;
  s.setProperty("--t-bg", bg.length > 1
    ? "linear-gradient(135deg, " + bg.join(", ") + ")"
    : (bg[0] || "#0b0d13"));
  s.setProperty("--t-surface", cssColour(t.surface));
  s.setProperty("--t-border", cssColour(t.border));
  s.setProperty("--t-text", cssColour(t.textPrimary));
  s.setProperty("--t-muted", cssColour(t.textSecondary));
  s.setProperty("--t-accent", cssColour(t.accent));
  // The dashboard's own overrides sit on top of whatever the theme asked
  // for — the same precedence the panel applies, so the preview agrees.
  const themeRadius = t.cornerRadius || 0;
  const radius = state.dashboard.roundedCorners
    ? (themeRadius > 0 ? themeRadius : 20)
    : 0;
  const shadow = !!state.dashboard.tileShadows;

  // Scaled from the panel's width to the canvas's, so a corner looks as
  // round here as it will on the wall.
  s.setProperty("--t-radius", (radius / 1920 * 100) + "cqw");
  s.setProperty("--t-shadow", shadow ? "0 6px 18px rgba(0,0,0,.25)" : "none");
  canvas.style.color = cssColour(t.textPrimary);
}

function previewBody(w, t, el) {
  // The real thing where the kiosk could tell us what this widget is
  // showing, its stand-in content where it could not — a feed with no
  // address yet, or a service with nothing to report.
  const lines = state.live[w.id]
    || (t && t.preview && t.preview.length ? t.preview : null)
    || [{ text: t ? t.name : w.type, scale: 0.14, muted: true, accent: false }];

  // Heights are a fraction of the tile, and the tile is a fraction of the
  // canvas, so a preview stays honest as either is resized. Container query
  // units do that arithmetic in CSS rather than here.
  const canvasRows = state.schema.grid.rows;
  const scale = (w.fontScale || 1);
  let html = '<div class="body">';
  for (const line of lines) {
    const size = (line.scale * (w.height / canvasRows) * 100 * scale);
    // The asked-for size is kept on the element because fitting shrinks it,
    // and a second fit must start from the original rather than from the
    // already-shrunk value — otherwise repeated renders creep towards zero.
    html += '<div class="line' + (line.muted ? " muted" : "") +
      (line.accent ? " accent" : "") + '" data-cqh="' + size +
      '" style="font-size:' + size +
      "cqh;text-align:" + (line.centre ? "center" : "left") + '">' +
      escapeHtml(substitute(line.text)) + "</div>";
  }
  return html + "</div>";
}

function substitute(text) {
  const now = new Date();
  const two = (n) => String(n).padStart(2, "0");
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];
  return text
    .replace("{time}", two(now.getHours()) + ":" + two(now.getMinutes()))
    .replace("{date}", days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()]);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function render() {
  const { columns, rows } = state.schema.grid;
  renderPageBar();
  const t = currentTheme();
  // Exactly the arithmetic the kiosk lays out with, so what you drag here is
  // where it lands — including the gap between tiles and around the edges.
  const gapX = (t && t.gap ? t.gap : 14) / 1920 * 100;
  const gapY = (t && t.gap ? t.gap : 14) / 1200 * 100;
  const cellW = (100 - gapX * (columns + 1)) / columns;
  const cellH = (100 - gapY * (rows + 1)) / rows;

  applyTheme();
  for (const el of [...canvas.querySelectorAll(".tile")]) el.remove();
  let anyClash = false;

  for (const w of widgetsOnPage()) {
    const t = typeOf(w.type);
    const el = document.createElement("div");
    el.className = "tile" + (w.id === state.selectedId ? " selected" : "") +
      (drag && drag.widget.id === w.id ? " dragging" : "");
    el.style.left = (gapX + w.x * (cellW + gapX)) + "%";
    el.style.top = (gapY + w.y * (cellH + gapY)) + "%";
    el.style.width = (w.width * cellW + (w.width - 1) * gapX) + "%";
    el.style.height = (w.height * cellH + (w.height - 1) * gapY) + "%";
    el.dataset.id = w.id;

    const clash = widgetsOnPage().some(o => o.id !== w.id && overlaps(w, o));
    if (clash) { el.classList.add("clash"); anyClash = true; }

    el.innerHTML =
      '<div class="badge">' + (t ? t.glyph : "❓") + "</div>" +
      previewBody(w, t, el) +
      '<div class="handle"></div>';
    // The font and size chosen for this widget, so the preview is the thing
    // itself rather than a label for it.
    el.style.fontFamily = w.fontFamily
      ? ('"' + w.fontFamily + '", system-ui, sans-serif')
      : "system-ui, sans-serif";

    canvas.appendChild(el);
  }

  // Only measurable once the tiles are laid out, so this is a second pass
  // rather than part of building them.
  fitAllPreviews();

  document.getElementById("clashWarning").hidden = !anyClash;
  renderSettings();
}

/* Shrink preview text that does not fit its tile.

   The sizes in a widget's preview are given as a fraction of the tile's
   *height*, which says nothing about whether the text fits across it. A wide
   line in a narrow tile was therefore sized correctly and then ellipsised —
   "10:34" showing as "10:…" — and several lines in a short tile overflowed
   the bottom. Both looked like the preview was broken rather than that the
   text was too big for the space.

   Measured and scaled rather than solved in CSS: how wide a string renders
   depends on the font, and the editor offers twenty of them. */
function fitPreview(tile) {
  const body = tile.querySelector(".body");
  if (!body) return;
  const lines = [...body.querySelectorAll(".line")];
  if (!lines.length) return;

  // Start from the asked-for sizes, so fitting twice gives the same answer as
  // fitting once rather than creeping towards zero.
  for (const line of lines) {
    const base = parseFloat(line.dataset.cqh);
    if (base) line.style.fontSize = base + "cqh";
  }

  // Across: one factor for the whole tile, from whichever line overflows
  // worst, so the relative sizes of the lines survive. Floored, past which a
  // line ellipsises — which is what the widget does on the panel anyway.
  let across = 1;
  for (const line of lines) {
    if (line.clientWidth > 0 && line.scrollWidth > line.clientWidth) {
      across = Math.min(across, line.clientWidth / line.scrollWidth);
    }
  }
  across = Math.max(across, lines.length === 1 ? 0.15 : 0.5);

  // Down: only worth shrinking for a modest overrun. A news tile is handed
  // twenty lines and is never going to fit them; squeezing it until they all
  // show would leave text far too small to read, when what the widget really
  // does is draw items until it runs out of room and clip the rest. So this
  // absorbs a little overflow and lets anything beyond that be clipped.
  let down = 1;
  if (body.clientHeight > 0 && body.scrollHeight > body.clientHeight) {
    down = Math.max(body.clientHeight / body.scrollHeight, 0.7);
  }

  const factor = Math.min(across, down) * 0.98;
  if (factor >= 1) return;
  for (const line of lines) {
    const base = parseFloat(line.dataset.cqh);
    if (base) line.style.fontSize = (base * factor) + "cqh";
  }
}

function fitAllPreviews() {
  for (const tile of canvas.querySelectorAll(".tile")) fitPreview(tile);
}

/* ---------- dragging and resizing ---------- */

// One pointer handler for both, because a phone and a mouse should behave
// the same and Pointer Events already unify them.
let drag = null;

canvas.addEventListener("pointerdown", (e) => {
  const tile = e.target.closest(".tile");
  if (!tile) { state.selectedId = null; render(); return; }

  const w = state.dashboard.widgets.find(x => x.id === tile.dataset.id);
  if (!w) return;

  state.selectedId = w.id;
  const rect = canvas.getBoundingClientRect();
  drag = {
    widget: w,
    mode: e.target.classList.contains("handle") ? "resize" : "move",
    startX: e.clientX,
    startY: e.clientY,
    originX: w.x, originY: w.y, originW: w.width, originH: w.height,
    cellW: rect.width / state.schema.grid.columns,
    cellH: rect.height / state.schema.grid.rows,
  };
  canvas.setPointerCapture(e.pointerId);
  render();
  e.preventDefault();
});

canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const { columns, rows } = state.schema.grid;
  const dx = Math.round((e.clientX - drag.startX) / drag.cellW);
  const dy = Math.round((e.clientY - drag.startY) / drag.cellH);
  const w = drag.widget;
  const t = typeOf(w.type) || { minWidth: 1, minHeight: 1 };

  if (drag.mode === "move") {
    const nx = clamp(drag.originX + dx, 0, columns - w.width);
    const ny = clamp(drag.originY + dy, 0, rows - w.height);
    if (nx === w.x && ny === w.y) return;
    w.x = nx; w.y = ny;
  } else {
    const nw = clamp(drag.originW + dx, t.minWidth || 1, columns - w.x);
    const nh = clamp(drag.originH + dy, t.minHeight || 1, rows - w.y);
    if (nw === w.width && nh === w.height) return;
    w.width = nw; w.height = nh;
  }
  markDirty();
  render();
});

function endDrag() {
  if (!drag) return;
  drag = null;
  // Re-rendered so the dragged tile drops back into the normal stacking
  // order rather than staying raised until something else redraws.
  render();
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ---------- palette ---------- */

function renderPalette() {
  const palette = document.getElementById("palette");
  palette.innerHTML = "";
  for (const t of state.schema.widgetTypes) {
    const b = document.createElement("button");
    b.title = t.description;
    b.innerHTML = '<span class="g">' + t.glyph + '</span><span class="n">' + t.name + "</span>";
    b.onclick = () => addWidget(t);
    palette.appendChild(b);
  }
}

function firstFreeSlot(width, height) {
  const { columns, rows } = state.schema.grid;
  for (let y = 0; y <= rows - height; y++) {
    for (let x = 0; x <= columns - width; x++) {
      const candidate = { x, y, width, height };
      if (!widgetsOnPage().some(w => overlaps(candidate, w))) return { x, y };
    }
  }
  return null;
}

function addWidget(t) {
  const slot = firstFreeSlot(t.defaultWidth, t.defaultHeight) || { x: 0, y: 0 };
  const options = {};
  for (const o of t.options) {
    if (o.default !== null && o.default !== undefined) options[o.key] = o.default;
  }
  const id = "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.dashboard.widgets.push({
    id, type: t.type,
    x: slot.x, y: slot.y,
    width: t.defaultWidth, height: t.defaultHeight,
    page: state.page,
    fontFamily: "", fontScale: 1,
    options,
  });
  state.selectedId = id;
  markDirty();
  render();
}

/* ---------- settings form, built from the schema ---------- */

function renderSettings() {
  const host = document.getElementById("settings");
  const w = state.dashboard.widgets.find(x => x.id === state.selectedId);
  if (!w) {
    host.innerHTML = '<p class="empty">Select a widget to change its settings.</p>';
    return;
  }
  const t = typeOf(w.type);
  host.innerHTML = "";

  const title = document.createElement("p");
  title.style.margin = "0 0 6px";
  title.innerHTML = "<strong>" + (t ? t.name : w.type) + "</strong>";
  host.appendChild(title);

  if (t && t.description) {
    const d = document.createElement("p");
    d.className = "help";
    d.textContent = t.description;
    host.appendChild(d);
  }

  if (t) {
    for (const o of t.options) {
      host.appendChild(field(w, o));
    }
  } else {
    const p = document.createElement("p");
    p.className = "help";
    p.textContent = "This kiosk build doesn't have a widget of this type. Its settings are kept as they are.";
    host.appendChild(p);
  }

  // Appearance is offered for every widget by the frame that draws it, so a
  // new widget gets these without asking and can't forget to honour them.
  const rule = document.createElement("hr");
  rule.style.cssText = "border:none;border-top:1px solid var(--line);margin:16px 0 4px";
  host.appendChild(rule);

  // Moving a widget between pages. Without this a widget could only ever be
  // created on a page, never moved off it, and dragging across a page break
  // is not a gesture this canvas has.
  const pageLabel = document.createElement("label");
  pageLabel.textContent = "Page";
  host.appendChild(pageLabel);
  const pageSel = document.createElement("select");
  for (let i = 0; i < pageCount(); i++) {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = "Page " + (i + 1);
    pageSel.appendChild(o);
  }
  pageSel.value = String(w.page || 0);
  pageSel.onchange = () => {
    w.page = parseInt(pageSel.value, 10) || 0;
    // It may well land on top of something over there, so drop it into the
    // first free slot on the page it is moving to rather than keeping
    // coordinates that were only free on the page it left.
    const was = state.page;
    state.page = w.page;
    const slot = firstFreeSlot(w.width, w.height);
    state.page = was;
    if (slot) { w.x = slot.x; w.y = slot.y; }
    markDirty();
    goToPage(w.page);
  };
  host.appendChild(pageSel);

  const fontLabel = document.createElement("label");
  fontLabel.textContent = "Font";
  host.appendChild(fontLabel);
  const fontSel = document.createElement("select");
  // Grouped, because twenty in one list is a scroll rather than a choice.
  const groups = new Map();
  for (const f of state.schema.fonts || []) {
    const key = f.groupLabel || "Other";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  }
  for (const [label, fonts] of groups) {
    const group = document.createElement("optgroup");
    group.label = label;
    for (const f of fonts) {
      const o = document.createElement("option");
      o.value = f.family; o.textContent = f.name;
      o.title = f.description;
      // Each name shown in its own face, so the list is the sample.
      if (f.family) o.style.fontFamily = '"' + f.family + '", system-ui';
      group.appendChild(o);
    }
    fontSel.appendChild(group);
  }
  fontSel.value = w.fontFamily || "";
  fontSel.onchange = () => { w.fontFamily = fontSel.value; markDirty(); render(); };
  host.appendChild(fontSel);
  const fontHelp = document.createElement("p");
  fontHelp.className = "help";
  const chosen = (state.schema.fonts || []).find(f => f.family === (w.fontFamily || ""));
  fontHelp.textContent = chosen ? chosen.description : "";
  host.appendChild(fontHelp);

  const sizeLabel = document.createElement("label");
  sizeLabel.textContent = "Text size";
  host.appendChild(sizeLabel);
  const sizeSel = document.createElement("select");
  for (const [name, value] of Object.entries(state.schema.fontScales || { Normal: 1 })) {
    const o = document.createElement("option");
    o.value = String(value); o.textContent = name;
    sizeSel.appendChild(o);
  }
  sizeSel.value = String(w.fontScale != null ? w.fontScale : 1);
  sizeSel.onchange = () => { w.fontScale = Number(sizeSel.value); markDirty(); render(); };
  host.appendChild(sizeSel);

  const size = document.createElement("p");
  size.className = "help";
  size.textContent = "Position " + (w.x + 1) + "," + (w.y + 1) + " · " + w.width + "x" + w.height + " cells";
  host.appendChild(size);

  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "Remove widget";
  del.style.marginTop = "10px";
  del.onclick = () => {
    state.dashboard.widgets = state.dashboard.widgets.filter(x => x.id !== w.id);
    state.selectedId = null;
    markDirty();
    render();
  };
  host.appendChild(del);
}

/* A colour input insists on #rrggbb, where a theme or an older config may
   have written #aarrggbb. */
function normaliseColour(v) {
  const hex = String(v).replace("#", "");
  if (hex.length === 8) return "#" + hex.slice(2);
  if (hex.length === 6) return "#" + hex;
  return "#7dd3fc";
}

/* A repeating group: rows of fields, a plus to add one, a cross to remove.
   Driven entirely by the option's declared fields, so any widget can have a
   list of anything without the editor knowing what it is. */
function listField(w, o) {
  const host = document.createElement("div");
  const rows = Array.isArray(w.options[o.key]) ? w.options[o.key] : [];
  w.options[o.key] = rows;

  rows.forEach((row, index) => {
    const card = document.createElement("div");
    card.style.cssText =
      "border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;position:relative";

    for (const f of o.fields || []) {
      const label = document.createElement("label");
      label.textContent = f.label;
      label.style.marginTop = "6px";
      card.appendChild(label);

      const input = document.createElement("input");
      if (f.kind === "colour") {
        input.type = "color";
        input.style.height = "40px";
        input.value = normaliseColour(row[f.key] != null ? row[f.key] : f.default);
      } else {
        input.type = f.kind === "number" ? "number" : "text";
        input.value = row[f.key] != null ? String(row[f.key]) : "";
      }
      input.oninput = () => {
        row[f.key] = f.kind === "number" ? Number(input.value) : input.value;
        markDirty();
        render();
      };
      card.appendChild(input);
    }

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.textContent = "Remove";
    remove.style.marginTop = "10px";
    remove.onclick = () => {
      rows.splice(index, 1);
      markDirty();
      render();
    };
    card.appendChild(remove);
    host.appendChild(card);
  });

  const add = document.createElement("button");
  add.textContent = "＋ " + (o.addLabel || "Add");
  add.style.marginTop = "10px";
  add.onclick = () => {
    const row = {};
    for (const f of o.fields || []) {
      if (f.default !== null && f.default !== undefined) row[f.key] = f.default;
    }
    rows.push(row);
    markDirty();
    render();
  };
  host.appendChild(add);
  return host;
}

function field(w, o) {
  const wrap = document.createElement("div");
  const value = w.options[o.key] !== undefined ? w.options[o.key] : o.default;

  if (o.kind === "boolean") {
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "12px";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!value;
    input.onchange = () => { w.options[o.key] = input.checked; markDirty(); };
    const label = document.createElement("span");
    label.textContent = o.label;
    row.append(input, label);
    wrap.appendChild(row);
  } else {
    const label = document.createElement("label");
    label.textContent = o.label;
    wrap.appendChild(label);

    let input;
    if (o.kind === "list") {
      wrap.appendChild(listField(w, o));
      if (o.help) {
        const help = document.createElement("p");
        help.className = "help";
        help.textContent = o.help;
        wrap.appendChild(help);
      }
      return wrap;
    } else if (o.kind === "colour") {
      input = document.createElement("input");
      input.type = "color";
      input.style.height = "42px";
      input.value = normaliseColour(value != null ? String(value) : "#7dd3fc");
      input.oninput = () => { w.options[o.key] = input.value; markDirty(); render(); };
    } else if (o.kind === "choice") {
      input = document.createElement("select");
      // A list the kiosk supplies — which albums exist, say — rather than one
      // written into the widget. Falls back to the declared choices, so a
      // list that could not be fetched leaves a usable field rather than an
      // empty dropdown.
      const dynamic = o.choicesFrom ? (state.schema.lists || {})[o.choicesFrom] : null;
      const entries = dynamic && Object.keys(dynamic).length
        ? dynamic
        : (o.choices || {});
      for (const [k, name] of Object.entries(entries)) {
        const opt = document.createElement("option");
        opt.value = k; opt.textContent = name;
        input.appendChild(opt);
      }
      input.value = value != null ? String(value) : "";
      input.onchange = () => { w.options[o.key] = input.value; markDirty(); render(); };
    } else if (o.kind === "multiline") {
      input = document.createElement("textarea");
      input.value = value != null ? String(value) : "";
      input.oninput = () => { w.options[o.key] = input.value; markDirty(); };
    } else {
      input = document.createElement("input");
      input.type = o.kind === "number" ? "number" : "text";
      input.value = value != null ? String(value) : "";
      input.oninput = () => {
        w.options[o.key] = o.kind === "number"
          ? (input.value === "" ? 0 : Number(input.value))
          : input.value;
        markDirty();
      };
    }
    wrap.appendChild(input);
  }

  if (o.help) {
    const help = document.createElement("p");
    help.className = "help";
    help.textContent = o.help;
    wrap.appendChild(help);
  }
  return wrap;
}

/* ---------- themes, save, load ---------- */

/// Loads the same font files the panel uses, served by the kiosk itself, so
/// the preview shows the real typeface rather than a browser substitute.
function installFonts() {
  const css = (state.schema.fonts || [])
    .filter(f => f.file)
    .map(f => '@font-face{font-family:"' + f.family +
      '";src:url("/fonts/' + f.file + '") format("truetype");font-display:swap;}')
    .join("\n");
  const style = document.createElement("style");
  style.textContent = css;
  document.head.appendChild(style);
}

/// Widgets on the page being edited. Everything in the canvas — drawing,
/// clash detection, finding a free slot — works from this rather than the
/// whole list, so two widgets on different pages are not treated as
/// overlapping when they can never be on screen together.
function widgetsOnPage() {
  return state.dashboard.widgets.filter(w => (w.page || 0) === state.page);
}

function pageCount() {
  let highest = 0;
  for (const w of state.dashboard.widgets) highest = Math.max(highest, w.page || 0);
  // At least one more than the highest in use when the user has added an
  // empty page to fill, so a new page does not vanish before anything is
  // put on it.
  return Math.max(highest + 1, state.pagesShown || 1);
}

function goToPage(i) {
  const count = pageCount();
  state.page = ((i % count) + count) % count;
  state.selectedId = null;
  render();
}

function renderPageBar() {
  const count = pageCount();
  document.getElementById("pageLabel").textContent =
    "Page " + (state.page + 1) + " / " + count;
  document.getElementById("pagePrev").onclick = () => goToPage(state.page - 1);
  document.getElementById("pageNext").onclick = () => goToPage(state.page + 1);
  document.getElementById("pageAdd").onclick = () => {
    state.pagesShown = count + 1;
    goToPage(count);
  };
  const del = document.getElementById("pageDel");
  del.disabled = count <= 1;
  del.onclick = () => {
    const onThis = widgetsOnPage();
    if (onThis.length &&
        !confirm("Delete page " + (state.page + 1) + " and its " +
                 onThis.length + " widget(s)?")) return;
    // Everything above this page shuffles down, so the numbering stays
    // contiguous instead of leaving a gap that renders as a blank page.
    state.dashboard.widgets = state.dashboard.widgets
      .filter(w => (w.page || 0) !== state.page)
      .map(w => ({ ...w, page: (w.page || 0) > state.page ? (w.page || 0) - 1 : (w.page || 0) }));
    state.pagesShown = Math.max(1, count - 1);
    markDirty();
    goToPage(Math.min(state.page, state.pagesShown - 1));
  };
}

/* Collapsing the sidebar panels.

   Which are open is remembered in localStorage rather than in the dashboard
   config: it is a preference of whoever is looking at this browser, not part
   of what the panel displays, and it should not make the config dirty or
   travel to the kiosk. */
const PANEL_KEY = "kiosk.editor.collapsed";

function collapsedPanels() {
  try {
    return new Set(JSON.parse(localStorage.getItem(PANEL_KEY) || "[]"));
  } catch {
    return new Set();
  }
}

function installPanels() {
  const collapsed = collapsedPanels();
  for (const card of document.querySelectorAll("aside .card[data-panel]")) {
    const name = card.dataset.panel;
    if (collapsed.has(name)) card.classList.add("collapsed");
    const head = card.querySelector(".panelHead");
    if (!head) continue;
    head.onclick = () => {
      card.classList.toggle("collapsed");
      const now = collapsedPanels();
      if (card.classList.contains("collapsed")) now.add(name);
      else now.delete(name);
      try {
        localStorage.setItem(PANEL_KEY, JSON.stringify([...now]));
      } catch {
        // Private browsing, or storage full. Collapsing still works for this
        // visit; it just will not be remembered.
      }
      // The canvas does not change size, but a panel opening can change the
      // sidebar's scroll height — refit so nothing is left measured wrong.
      fitAllPreviews();
    };
  }
}

function renderPaging() {
  const secs = document.getElementById("pageSeconds");
  secs.value = state.dashboard.pageSeconds || 0;
  secs.onchange = () => {
    const v = parseInt(secs.value, 10);
    // Matches the model: 0 is manual, anything else is floored at 3s so a
    // typo cannot make the panel strobe.
    state.dashboard.pageSeconds = (!v || v <= 0) ? 0 : Math.min(3600, Math.max(3, v));
    secs.value = state.dashboard.pageSeconds;
    markDirty();
  };
  const tap = document.getElementById("tapToFlip");
  tap.checked = !!state.dashboard.tapToFlip;
  tap.onchange = () => {
    state.dashboard.tapToFlip = tap.checked;
    markDirty();
  };
}

function renderOverrides() {
  for (const key of ["roundedCorners", "tileShadows"]) {
    const box = document.getElementById(key);
    box.checked = state.dashboard[key] !== false;
    box.onchange = () => {
      state.dashboard[key] = box.checked;
      markDirty();
      render();
    };
  }
}

function renderThemes() {
  const sel = document.getElementById("theme");
  sel.innerHTML = "";
  for (const t of state.schema.themes) {
    const o = document.createElement("option");
    o.value = t.id; o.textContent = t.name;
    sel.appendChild(o);
  }
  sel.value = state.dashboard.themeId;
  sel.onchange = () => {
    state.dashboard.themeId = sel.value;
    markDirty();
    // Repaint straight away rather than waiting for a save, so picking a
    // theme shows you the theme.
    render();
  };
}

document.getElementById("save").onclick = async () => {
  try {
    setStatus("Saving…");
    await api.put("/api/dashboard", state.dashboard);
    state.dirty = false;
    setStatus("Saved");
  } catch (e) {
    setStatus("Save failed", true);
    console.error(e);
  }
};

document.getElementById("revert").onclick = () => load(true);

// Nothing here is saved until you press Save, so leaving with changes
// pending would silently lose them.
window.addEventListener("beforeunload", (e) => {
  if (!state.dirty) return;
  e.preventDefault();
  e.returnValue = "";
});

async function load(quiet) {
  try {
    if (!quiet) setStatus("Loading…");
    const [schema, dashboard] = await Promise.all([
      api.get("/api/schema"),
      api.get("/api/dashboard"),
    ]);
    state.schema = schema;
    state.dashboard = dashboard;
    state.selectedId = null;
    state.dirty = false;
    state.page = 0;
    state.pagesShown = Math.max(
      1,
      ...state.dashboard.widgets.map(w => (w.page || 0) + 1),
    );
    installFonts();
    installPanels();
    renderPalette();
    renderThemes();
    renderOverrides();
    renderPaging();
    render();
    setStatus("Ready");
  } catch (e) {
    setStatus("Could not reach the kiosk", true);
    console.error(e);
  }
}

/* The panel's current content. Refreshed on a timer so a clock ticks and a
   headline changes here as it does on the wall. */
async function refreshLive() {
  try {
    state.live = await api.get("/api/preview");
    if (state.schema) render();
  } catch (e) {
    // A preview that can't be fetched isn't worth interrupting editing for.
  }
}

load().then(refreshLive);
setInterval(refreshLive, 20000);

/* The fitted sizes are measured, so they go stale whenever the measurement
   would come out differently. Two cases, both easy to miss:

   - The canvas changes width when the browser window does. Text is sized as
     a fraction of *height*, so a wider canvas does not change the size but
     does change whether it fits.
   - The dashboard fonts arrive after the page does. Anything measured before
     they land was measured in the fallback face, which is a different width. */
if (window.ResizeObserver) {
  new ResizeObserver(() => fitAllPreviews()).observe(canvas);
}
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => fitAllPreviews());
}
</script>
</body>
</html>
