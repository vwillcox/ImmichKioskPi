name: immich_kiosk_pi
description: "Touchscreen Immich photo/video browser for a Raspberry Pi DSI display."
# Licensed under the MIT License — see LICENSE.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Networking (Immich REST API)
  dio: ^5.7.0

  # Images with auth headers + disk cache
  cached_network_image: ^3.4.1

  # Disk cache control (pinned to the NVMe, not tmpfs /tmp)
  flutter_cache_manager: ^3.4.2
  file: ^7.0.1


  # Video (libmpv-backed; supports playback speed on Linux)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Path joining for cache locations
  path: ^1.9.0

  # D-Bus client, used to read BlueZ media metadata (now playing on the phone)
  dbus: ^0.7.10

  # SHA-256 for Spotify's OAuth PKCE code challenge
  crypto: ^3.0.5

  # RSS/Atom parsing for the dashboard's news widget
  xml: ^6.6.1

  # Hisense VIDAA televisions are controlled over MQTT
  mqtt_client: ^10.11.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/incoming.wav
    - assets/dashboard/editor.html
    # Also listed as assets so the browser editor can be served the same
    # files, and its preview shows the typeface the panel will actually use.
    - assets/fonts/
    # Client certificate the television's MQTT broker requires. Extracted
    # from the vendor's own app and public in the pyvidaa/hisense-tv
    # community — not a secret of this installation.
    - assets/certs/

  fonts:
    - family: Inter
      fonts: [{ asset: assets/fonts/Inter.ttf }]
    - family: SourceSans3
      fonts: [{ asset: assets/fonts/SourceSans3.ttf }]
    - family: Lora
      fonts: [{ asset: assets/fonts/Lora.ttf }]
    - family: JetBrainsMono
      fonts: [{ asset: assets/fonts/JetBrainsMono.ttf }]
    - family: Oswald
      fonts: [{ asset: assets/fonts/Oswald.ttf }]
    - family: Quicksand
      fonts: [{ asset: assets/fonts/Quicksand.ttf }]
    - family: Comfortaa
      fonts: [{ asset: assets/fonts/Comfortaa.ttf }]
    - family: Nunito
      fonts: [{ asset: assets/fonts/Nunito.ttf }]
    - family: Fredoka
      fonts: [{ asset: assets/fonts/Fredoka.ttf }]
    - family: ComicNeue
      fonts: [{ asset: assets/fonts/ComicNeue.ttf }]
    - family: PatrickHand
      fonts: [{ asset: assets/fonts/PatrickHand.ttf }]
    - family: Orbitron
      fonts: [{ asset: assets/fonts/Orbitron.ttf }]
    - family: ChakraPetch
      fonts: [{ asset: assets/fonts/ChakraPetch.ttf }]
    - family: ShareTechMono
      fonts: [{ asset: assets/fonts/ShareTechMono.ttf }]
    - family: SpaceMono
      fonts: [{ asset: assets/fonts/SpaceMono.ttf }]
    - family: VT323
      fonts: [{ asset: assets/fonts/VT323.ttf }]
    - family: PressStart2P
      fonts: [{ asset: assets/fonts/PressStart2P.ttf }]
    - family: BebasNeue
      fonts: [{ asset: assets/fonts/BebasNeue.ttf }]
    - family: Bangers
      fonts: [{ asset: assets/fonts/Bangers.ttf }]
