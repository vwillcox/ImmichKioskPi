name: tabletpi
description: "Touchscreen Immich browser for a Raspberry Pi DSI display."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State
  provider: ^6.1.2

  # Networking (Immich REST API)
  dio: ^5.7.0

  # Images with auth headers + disk cache
  cached_network_image: ^3.4.1


  # Video (libmpv-backed; supports playback speed on Linux)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # PIN hashing + paths
  crypto: ^3.0.6
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
