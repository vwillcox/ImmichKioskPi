name: tabletpi
description: "Touchscreen Immich photo/video browser for a Raspberry Pi DSI display."
# Licensed under the MIT License — see LICENSE.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Networking (Immich REST API)
  dio: ^5.7.0

  # Images with auth headers + disk cache
  cached_network_image: ^3.4.1

  # Disk cache control (pinned to the NVMe, not tmpfs /tmp)
  flutter_cache_manager: ^3.4.2
  file: ^7.0.1


  # Video (libmpv-backed; supports playback speed on Linux)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Path joining for cache locations
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
